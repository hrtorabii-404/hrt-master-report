framework:
  name: "HRT Master Report"
  version: "3.2.4"
  owner: "Hamid Reza Torabi"
  generic_master: true
  supported_profiles: [passive_defense, feasibility_study, investment_study, urban_regional_planning, executive_report, proposal]

master_assets:
  automation_reference: "assets/HRT_Master_Report_V3_2_4_REFERENCE.docx"
  microsoft_word_template: "assets/HRT_Master_Report_V3_2_4.dotx"
  immutable: true

hard_constraints:
  rebuild_cover: false
  rebuild_identity_tables: false
  rebuild_header: false
  replace_logo_with_text: false
  body_font_reduction_to_fit: false
  typed_bullet_characters: false
  bidiVisual_as_substitute_for_semantic_rtl: false
  title2_shading: false
  typed_heading_number_or_hyphen: false
  manual_toc_rows: false
  decorative_color_cards: false
  numbering_direction_marks: false

rtl:
  document_language: "fa-IR"
  body_paragraph_bidi: true
  persian_run_rtl_complex_script: true
  every_persian_table_bidiVisual: true
  semantic_table_rtl: true
  first_logical_column_visual_side: right
  bullet_num_id: 11

body:
  style: "Textbody_RYM"
  font_fa: "B Nazanin"
  font_en: "Times New Roman"
  size_pt: 12
  line_spacing: 1.15
  alignment: justify

tables:
  font_fa: "B Nazanin"
  size_pt: 11
  horizontal_alignment: center
  vertical_alignment: center
  semantic_rtl: true

headings:
  common_multilevel_num_id: 1
  patterns: ["%1-", "%1-%2-", "%1-%2-%3-"]
  direction_marks_in_lvlText: forbidden
  title2_shading: none

toc:
  fix_scope: "TOC only; do not modify body numbering"
  TOC1: {font: "B Nazanin", size_pt: 12, bold: true}
  TOC2: {font: "B Nazanin", size_pt: 12, bold: false}
  TOC3: {font: "B Nazanin", size_pt: 12, bold: false}
  TableofFigures: {font: "B Nazanin", size_pt: 11, bold: false}

fields:
  require_toc: true
  require_list_of_tables: true
  require_list_of_images: true
  caption_table: "SEQ جدول"
  caption_image: "SEQ تصویر"
  cross_reference: "REF"
  page: "PAGE"
  page_count: "NUMPAGES"

qa:
  structural_required: true
  semantic_rtl_table_audit_required: true
  table_font_size_audit_required: true
  table_centering_audit_required: true
  numbering_direction_mark_audit_required: true
  toc_font_audit_required: true
  render_all_pages_required: true

output_naming:
  dynamic: true
  prefix: "HRT"
  pattern: "HRT_[Domain]_[DocumentType]_[ProjectName]_[OptionalScope]_[OptionalRevision].ext"
  separator: "_"
  project_name_required: true
  prefer_official_english_project_name: true
  guessed_transliteration_forbidden: true
  preserve_user_supplied_filename: true
  docx_pdf_same_basename: true
  generic_output_names_forbidden: ["output", "final", "HRT_Report", "HRT_Master_Report_Output"]
