profile:
  id: "feasibility_study"
  display_name_fa: "مطالعات امکان‌سنجی / پیش‌امکان‌سنجی"
  aliases:
    - "FS"
    - "PFS"
    - "Feasibility Study"
    - "Pre-Feasibility Study"

purpose: "Evaluate market, technical, implementation, financial, economic, environmental, social, and risk feasibility with auditable assumptions."

required_inputs:
  - "study horizon and base date"
  - "currency and price basis"
  - "market demand and price evidence"
  - "technical concept, capacity, and implementation schedule"
  - "CAPEX and OPEX basis"
  - "revenue and working-capital assumptions"
  - "tax, financing, inflation, escalation, and discount-rate basis"
  - "scenario definitions"

analysis_objects:
  - "market"
  - "technical_solution"
  - "capacity"
  - "schedule"
  - "CAPEX"
  - "OPEX"
  - "revenue"
  - "cash_flow"
  - "NPV"
  - "IRR"
  - "BCR"
  - "payback"
  - "DSCR"
  - "sensitivity"
  - "scenario"
  - "risk"

recommended_modules:
  - "خلاصه مدیریتی و نتیجه امکان‌سنجی"
  - "دامنه، مبانی و سناریوها"
  - "مطالعات بازار"
  - "مطالعات فنی و ظرفیت"
  - "برنامه اجرا و بهره‌برداری"
  - "برآورد سرمایه‌گذاری و هزینه‌های بهره‌برداری"
  - "درآمد و صورت جریان نقدی"
  - "تحلیل مالی"
  - "تحلیل اقتصادی و آثار توسعه‌ای، در صورت نیاز"
  - "تحلیل حساسیت و سناریو"
  - "ریسک‌ها و شروط تصمیم"
  - "پیشنهاد و گام‌های بعدی"

hard_constraints:
  - "State nominal versus real values, currency, base date, and escalation treatment."
  - "Do not mix financial and economic cash flows or discount rates."
  - "Do not calculate IRR, NPV, BCR, Payback, or DSCR from missing assumptions without clearly labeled scenarios."
  - "Keep source values, derived calculations, and consultant assumptions distinguishable."
  - "Validate units, signs, periods, taxes, depreciation, working capital, salvage value, and financing treatment."

decision_outputs:
  - "go, conditional go, defer, or no-go recommendation"
  - "critical assumptions"
  - "base, downside, and upside scenario"
  - "decision thresholds"
  - "required due diligence"
