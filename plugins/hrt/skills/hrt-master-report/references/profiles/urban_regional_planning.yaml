profile:
  id: "urban_regional_planning"
  display_name_fa: "برنامه‌ریزی شهری و منطقه‌ای"
  aliases:
    - "Urban Planning"
    - "Regional Planning"
    - "برنامه‌ریزی فضایی"

purpose: "Develop a spatially explicit, evidence-based assessment of population, land use, infrastructure, environment, economy, governance, and implementation options."

required_inputs:
  - "study boundary and spatial reference"
  - "baseline year and planning horizon"
  - "official population and socioeconomic data"
  - "land-use, transport, infrastructure, environmental, and hazard layers"
  - "plans, approvals, ownership, and regulatory constraints"
  - "stakeholder and governance information"
  - "scenario and evaluation criteria"

analysis_objects:
  - "population"
  - "settlement_system"
  - "land_use"
  - "accessibility"
  - "infrastructure"
  - "environment"
  - "hazard"
  - "economy"
  - "governance"
  - "scenario"
  - "spatial_intervention"

recommended_modules:
  - "خلاصه مدیریتی"
  - "دامنه، روش و نظام داده"
  - "جایگاه منطقه و پیوندهای فرادست"
  - "جمعیت، سکونت و ساختار فضایی"
  - "کاربری زمین و ظرفیت توسعه"
  - "حمل‌ونقل، دسترسی و زیرساخت"
  - "محیط‌زیست، مخاطرات و تاب‌آوری"
  - "اقتصاد، اشتغال و مزیت‌های منطقه"
  - "نهادها، ذی‌نفعان و حکمرانی"
  - "سناریوهای توسعه و ارزیابی"
  - "راهبرد فضایی و پروژه‌های محرک"
  - "برنامه اجرا، پایش و شاخص‌ها"

hard_constraints:
  - "State CRS, source, scale, resolution, date, and processing lineage for material spatial evidence."
  - "Do not compare layers with incompatible dates, units, or coordinate systems without adjustment and disclosure."
  - "Distinguish approved plans from consultant scenarios."
  - "Do not infer legal land status, ownership, or development rights."
  - "Use the Landscape section for wide matrices and maps while preserving legible captions and sources."

decision_outputs:
  - "preferred spatial scenario"
  - "priority interventions"
  - "implementation actor"
  - "phasing and prerequisites"
  - "monitoring indicator"
