version: "3.2.3"
policy:
  generic_master: true
  golden_master_clone_required: true
  report_profile_must_not_change_visual_identity: true

paragraph_styles:
  body:
    internal_id: "TextbodyRYM"
    visible_name: "Textbody_RYM"
    font_fa: "B Nazanin"
    font_en: "Times New Roman"
    size_pt: 12
    rtl: true
    alignment: "justify"
    line_spacing: 1.15
  level_1: {internal_id: "Title1RYM", visible_name: "Title1_RYM", font_fa: "B Nazanin", size_pt: 16, num_id: 1, ilvl: 0}
  level_2: {internal_id: "Title2RYM", visible_name: "Title2_RYM", font_fa: "B Nazanin", size_pt: 15, num_id: 1, ilvl: 1, shading: null}
  level_3: {internal_id: "Title3RYM", visible_name: "Title3_RYM", font_fa: "B Nazanin", size_pt: 14, num_id: 1, ilvl: 2}
  level_4: {internal_id: "Title4RYM", visible_name: "Title4_RYM", font_fa: "B Nazanin", size_pt: 13}
  level_5: {internal_id: "Title5RYM", visible_name: "Title5_RYM", font_fa: "B Nazanin", size_pt: 12}

table_rules:
  structural_rtl_ooxml: "w:tblPr/w:bidiVisual"
  semantic_rtl_required: true
  first_logical_column: "first XML cell; appears right-most in Microsoft Word"
  row_number_header: "ردیف must be first logical/XML Header cell when present"
  font_fa: "B Nazanin"
  size_pt: 11
  horizontal_alignment: center
  vertical_alignment: center
  header_bold: true
  header_fill: "#D9D9D9"
  border_color: "#000000"

numbering:
  chapter_multilevel_num_id: 1
  level_patterns: ["%1-", "%1-%2-", "%1-%2-%3-"]
  direction_control_chars_in_lvlText: forbidden
  rtl_bullet_num_id: 11
  rtl_bullet_level: 0
  typed_bullet_characters_forbidden: true

toc:
  TOC1: {font_fa: "B Nazanin", size_pt: 12, bold: true}
  TOC2: {font_fa: "B Nazanin", size_pt: 12, bold: false}
  TOC3: {font_fa: "B Nazanin", size_pt: 12, bold: false}
  TableofFigures: {font_fa: "B Nazanin", size_pt: 11, bold: false}
  direction_fix_scope: "TOC only"

fields:
  toc: "TOC"
  tables: 'TOC \c "جدول"'
  images: 'TOC \c "تصویر"'
  table_number: "SEQ جدول"
  image_number: "SEQ تصویر"
  cross_reference: "Bookmark + REF"
  page: "PAGE"
  page_count: "NUMPAGES"
