profile:
  id: "investment_study"
  display_name_fa: "مطالعات سرمایه‌گذاری"
  aliases:
    - "Investment Study"
    - "Investment Memorandum"
    - "طرح سرمایه‌گذاری"

purpose: "Frame an investment opportunity, its commercial logic, return drivers, funding needs, risks, and decision conditions."

required_inputs:
  - "investment thesis and decision audience"
  - "sponsor, ownership, and governance structure"
  - "market evidence and competitive position"
  - "business model and value drivers"
  - "capital requirement and funding plan"
  - "cash-flow assumptions and exit or terminal-value basis"
  - "legal, regulatory, land, permit, and contractual status"
  - "risk allocation and key dependencies"

analysis_objects:
  - "opportunity"
  - "sponsor"
  - "business_model"
  - "market_position"
  - "investment_requirement"
  - "funding_structure"
  - "return_driver"
  - "governance"
  - "risk_allocation"
  - "exit_or_terminal_value"

recommended_modules:
  - "خلاصه فرصت و درخواست تصمیم"
  - "معرفی پروژه، ذی‌نفعان و ساختار مالکیت"
  - "بازار، مشتری و رقبا"
  - "مدل کسب‌وکار و محرک‌های ارزش"
  - "برنامه فنی و اجرایی"
  - "نیاز سرمایه و ساختار تأمین مالی"
  - "بازده، سناریو و حساسیت"
  - "مسائل حقوقی، مجوزها و قراردادها"
  - "ریسک‌ها، تخصیص ریسک و شروط سرمایه‌گذاری"
  - "برنامه اقدام و نقاط کنترل"

hard_constraints:
  - "Do not present promotional language as an analytical conclusion."
  - "Identify conflicts of interest, source limitations, and sponsor-provided assumptions."
  - "Separate project returns, equity returns, and economic benefits."
  - "Do not infer permits, land rights, contracts, funding commitments, or guarantees."
  - "State all return metrics with currency, base date, horizon, and scenario."

decision_outputs:
  - "investment rationale"
  - "funding need and proposed structure"
  - "base and downside returns"
  - "conditions precedent"
  - "red flags and due diligence plan"
