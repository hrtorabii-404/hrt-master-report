profile:
  id: "proposal"
  display_name_fa: "پروپوزال / پیشنهاد فنی"
  aliases:
    - "Proposal"
    - "Technical Proposal"
    - "پیشنهاد فنی"
    - "پروپوزال"

purpose: "Present a concise, persuasive, evidence-based understanding of the assignment, methodology, work plan, team, deliverables, schedule, assumptions, exclusions, and relevant experience without creating unrequested contractual commitments."

required_inputs:
  - "client request, TOR, RFP, tender documents, or invitation letter"
  - "scope and required deliverables"
  - "submission format and evaluation criteria"
  - "project location and context"
  - "consultant qualifications and relevant experience"
  - "team composition and responsibilities"
  - "schedule or required completion period"
  - "commercial/financial submission rules, if within scope"

analysis_objects:
  - "client_need"
  - "scope"
  - "deliverable"
  - "methodology"
  - "work_package"
  - "team_role"
  - "schedule"
  - "assumption"
  - "exclusion"
  - "dependency"
  - "experience"
  - "evaluation_criterion"

recommended_modules:
  - "نامه یا مقدمه کوتاه پیشنهاد، در صورت نیاز"
  - "درک مسئله و اهداف پروژه"
  - "دامنه خدمات و خروجی‌های مورد انتظار"
  - "رویکرد و روش‌شناسی مشاور"
  - "ساختار شکست کار و مراحل انجام خدمات"
  - "برنامه زمانی و نقاط کنترل"
  - "سازمان پروژه، تیم و مسئولیت‌ها"
  - "کنترل کیفیت و مدیریت مستندات"
  - "تعامل با کارفرما و نیازمندی‌های ورودی"
  - "فرضیات، محدودیت‌ها و موارد خارج از دامنه"
  - "سوابق و تجارب مرتبط"
  - "جمع‌بندی ارزش پیشنهادی و اقدام بعدی"

hard_constraints:
  - "Follow the client TOR/RFP terminology and required submission order when mandatory."
  - "Do not add deliverables, liabilities, guarantees, staffing commitments, or design responsibilities that are not supported by the client documents or approved by the user."
  - "Distinguish consultant methodology from client obligations and inputs."
  - "Do not claim certifications, approvals, personnel, or project experience without evidence."
  - "Keep the proposal readable and decision-oriented; avoid unnecessary proliferation of subsections and bullets."
  - "If a commercial proposal is separate or sealed, do not mix price information into the technical proposal unless explicitly required."

decision_outputs:
  - "proposed approach"
  - "work packages and deliverables"
  - "schedule and milestones"
  - "team structure"
  - "client inputs and dependencies"
  - "assumptions and exclusions"
  - "submission compliance matrix, when useful"
