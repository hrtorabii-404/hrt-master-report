version: "3.2.4"
pattern: "HRT_[Domain]_[DocumentType]_[ProjectName]_[OptionalScope]_[OptionalRevision].ext"
prefix: "HRT"
separator: "_"
examples:
  - request: "کل پروپوزال پدافند غیرعامل اوراسیا"
    filename: "HRT_PassiveDefense_Proposal_Eurasia.docx"
  - request: "فصل اول پروپوزال پدافند غیرعامل اوراسیا"
    filename: "HRT_PassiveDefense_Proposal_Eurasia_Chapter01.docx"
  - request: "گزارش FS پروژه نمونه"
    filename: "HRT_FS_Report_ProjectName.docx"
constraints:
  project_name_required: true
  prefer_official_english_name: true
  do_not_guess_transliteration: true
  user_filename_override: true
  windows_invalid_characters: '<>:"/\\|?*'
  collapse_repeated_underscores: true
  trim_dots_spaces_underscores: true
